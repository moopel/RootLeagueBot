name: Deploy Root app

on:
  push:
    branches:
      - main

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bot
        run: npm run build

      - name: Set Root package version
        env:
          CI_RUN_NUMBER: ${{ github.run_number }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const manifestPath = "root-manifest.json";
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          const versionMatch = /^(\d+)\.(\d+)\.(\d+)$/.exec(manifest.version);

          if (!versionMatch) {
            throw new Error(`Expected a stable numeric version, got: ${manifest.version}`);
          }

          const runNumber = BigInt(process.env.CI_RUN_NUMBER);
          const [, major, minor, patch] = versionMatch;
          manifest.version = `${major}.${minor}.${BigInt(patch) + runNumber}`;

          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          console.log(`Publishing Root app version ${manifest.version}`);
          NODE

      - name: Build Root package
        run: npx rootsdk build package --output-file ./rootapp.pkg --project-folder .

      - name: Upload Root package
        env:
          ROOTAPP_AUTH_TOKEN: ${{ secrets.ROOTAPP_AUTH_TOKEN }}
        run: |
          if [ -z "$ROOTAPP_AUTH_TOKEN" ]; then
            echo "Missing required GitHub Actions secret: ROOTAPP_AUTH_TOKEN" >&2
            exit 1
          fi

          npx rootsdk upload package \
            --file ./rootapp.pkg \
            --authToken "$ROOTAPP_AUTH_TOKEN" \
            --host dev.rootapp.com
